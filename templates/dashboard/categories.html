{% extends "dashboard/base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<h1>Categories</h1>
<form method="post" class="card"><div class="card-body">{% csrf_token %}{{ form.as_p }}<button class="btn">Add category</button></div></form>
<table class="table">
  <thead><tr><th>Name</th><th>Products</th><th></th></tr></thead>
  {% for category in categories %}
    <tr>
      <td>{{ category.name }}</td>
      <td>{{ category.product_count }}</td>
      <td class="stack">
        <a class="btn small ghost" href="{% url 'dashboard:category_edit' category.pk %}">Edit</a>
        <form method="post" action="{% url 'dashboard:category_delete' category.pk %}">{% csrf_token %}<button class="btn small danger">Delete</button></form>
      </td>
    </tr>
  {% endfor %}
</table>
{% endblock %}
